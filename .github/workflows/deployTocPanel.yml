name: Publish Website to CPanel
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Without VITE_API_URL the client falls back to mock mode (see
      # web/src/api/client.ts) and would ship a fake-data app to production
      # rather than failing — so check before spending a build on it.
      - name: Check backend config is present
        env:
          # Passed as env rather than interpolated into the script: `${{ }}` is
          # spliced in as text, so a value containing a quote would break (or
          # escape) the shell command.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          test -n "$VITE_API_URL" || { echo "::error::VITE_API_URL secret is empty — the build would ship in mock mode."; exit 1; }
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "::error::VITE_GOOGLE_CLIENT_ID secret is empty — sign-in would be disabled."; exit 1; }

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Build SPA
        run: npm run build
        working-directory: web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./web/dist/
          # The FTP account is scoped to the linkulino subdomain, so its root
          # already *is* the docroot. Point this at the subdomain folder instead
          # if you ever swap in an account scoped to the whole hosting space.
          server-dir: ./
          # private/ holds the spreadsheet-backup config + backup files (see
          # docs/deployment.md's "spreadsheet backups" setup) — created by hand
          # on the server, not part of this git-tracked build. The action
          # treats `exclude` as covering both the publish AND delete side of
          # its sync (see its own docs), so without this, the next deploy would
          # see private/ as "removed" from the source and delete it on the
          # server. Re-listing the action's own defaults here since setting
          # `exclude` at all replaces them rather than adding to them.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/private/**
          # The action defaults to plain FTP, which would put the credentials
          # and the whole payload on the wire in the clear — so require FTPS.
          #
          # `security` stays loose (the action's own default) because
          # FTP_SERVER is an IP and the shared-hosting certificate doesn't
          # list it, so `strict` fails with ERR_TLS_CERT_ALTNAME_INVALID.
          # The connection is still fully encrypted — a passive observer on
          # the runner→cPanel path learns nothing — but the server's identity
          # isn't verified, so an active MITM could impersonate it. To close
          # that too, point FTP_SERVER at the hostname the certificate is
          # actually issued for and flip this back to `strict`:
          #   openssl s_client -connect <host>:21 -starttls ftp </dev/null \
          #     | openssl x509 -noout -subject -ext subjectAltName
          protocol: ftps
          security: loose
